[package]
name = "repo-radar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Analysis core for repo-radar: discovery, parsing, OSV ingestion, matching, scoring. No Tauri dependency."

[lib]
name = "repo_radar_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta.workspace = true

rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
blake3 = "1"

# Version schemes (M2-1)
semver = "1"
pep440_rs = "0.7"

# OSV ingestion (M2-11)
cvss = "2"

# Manifest parsers (M2-2 … M2-10)
toml = "1"
serde_yaml_ng = "0.10"

# Scan pipeline (M1)
ignore = "0.4"
# Local-only git access — no https/ssh features, we never fetch over the
# network (FR-7.6). libgit2 is vendored so no system dependency.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
tokei = "14"
rayon = "1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
